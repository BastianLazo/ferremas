{% extends 'home/base_generic.html' %}
{% load static %}

{% block title %}Contacto - FERREMAS{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Contacto por WhatsApp</h2>

    <!-- Mostrar mensajes de éxito o error -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Formulario de contacto -->
    <form method="post" action="{% url 'contacto' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label for="numero" class="form-label">Número de teléfono <strong>(sin +56)</strong>:</label>
            <input type="text" class="form-control" id="numero" name="numero" required pattern="\d{9}" placeholder="Ej: 912345678" title="Ingresa un número chileno válido de 9 dígitos.">
        </div>

        <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje:</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
    </form>
</div>
{% endblock %}
