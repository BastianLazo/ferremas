{% extends 'bodega/bodeguero_base.html' %}

{% block content %}
<h2>Editar Stock: {{ producto.nombre }}</h2>

<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label for="stock" class="form-label">Nuevo stock</label>
    <input type="number" id="stock" name="stock" class="form-control" value="{{ producto.stock }}" min="0" required>
  </div>
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'listar_productos_bodeguero' %}" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
