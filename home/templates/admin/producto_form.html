{% extends 'admin/admin_base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Editar Producto</h2>
    <a href="{% url 'listar_productos_admin' %}" class="btn btn-secondary mb-3">&larr; Volver a la lista</a>

    <form method="POST" enctype="multipart/form-data" class="shadow p-4 rounded bg-light">
        {% csrf_token %}

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción:</label>
            <textarea name="descripcion" class="form-control" rows="3" required>{{ producto.descripcion }}</textarea>
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio:</label>
            <input type="number" name="precio" step="1" class="form-control" value="{{ producto.precio|floatformat:0 }}"
                required>

        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock:</label>
            <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Imagen actual:</label><br>
            {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" alt="Imagen actual" class="img-thumbnail mb-2" width="150">
            {% else %}
            <p class="text-muted">No hay imagen</p>
            {% endif %}
            <input type="file" name="imagen" class="form-control">
        </div>
        <div class="mb-3">
            <label for="descuento" class="form-label">Descuento (%)</label>
            <input type="number" class="form-control" id="descuento" name="descuento"
                value="{{ producto.descuento|default:0 }}">
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'listar_productos_admin' %}" class="btn btn-outline-secondary">Volver</a>
        </div>
    </form>
</div>
{% endblock %}
